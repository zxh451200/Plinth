name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支的新提交顶掉旧的跑动
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 阻塞门禁:这条是本地实跑过的(windows-latest + Release,17 项 headless 断言全绿)
  gate:
    name: 构建与界面门禁 (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 按 global.json 准备 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - run: dotnet restore
      - run: dotnet build --no-restore -c Release -warnaserror:nullable
      - run: dotnet test --no-build -c Release

  # 观察位:本仓库宣称跨平台(AppPaths 的 XDG 口径、FolderService 的 shell 打开),
  # 但开发机上没有 WSL/Docker,Linux 这条没能本地验证过,所以先不阻塞合并。
  # 连续几次绿了就把 continue-on-error 去掉,升成正式门禁。
  linux-probe:
    name: Linux 观察位 (不阻塞)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: 按 global.json 准备 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - run: dotnet restore
      - run: dotnet build --no-restore -c Release -warnaserror:nullable
      - run: dotnet test --no-build -c Release
