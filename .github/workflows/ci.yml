name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    name: gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p "test_*.py"
      - run: python scripts/check_source_contracts.py
      - run: python scripts/integration_checks.py
      - run: python tests/sqlite_migration_smoke.py
      - run: python scripts/release_checks.py locks
      - run: dotnet restore Plinth.sln --locked-mode --configfile scripts/nuget.config
      - run: dotnet format Plinth.sln --verify-no-changes --no-restore
      - run: dotnet build Plinth.sln -c Release --no-restore -warnaserror:nullable
      - run: dotnet test Plinth.sln -c Release --no-build --no-restore -p:TestingPlatformDotnetTestSupport=true --logger trx --results-directory artifacts/test-results
      - name: Check optional XLSX page
        run: dotnet test tests/Plinth.App.Tests/Plinth.App.Tests.csproj -c Release --no-restore -p:PlinthEnableXlsx=true -p:TestingPlatformDotnetTestSupport=true --filter FullyQualifiedName~Spreadsheet --logger trx --results-directory artifacts/test-results-xlsx
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.os }}
          path: |
            artifacts/test-results
            artifacts/test-results-xlsx
          if-no-files-found: warn
  pilots:
    name: pilot (${{ matrix.pilot }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        pilot: [dock, runtime-plugins, offline-sync]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Bootstrap only: review/commit real generated locks before switching to locked.
      - run: python scripts/pilot_checks.py --mode generate-locks --pilot ${{ matrix.pilot }}
      - name: Upload pilot test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.pilot }}-${{ matrix.os }}
          path: artifacts/pilot-checks
          if-no-files-found: warn
